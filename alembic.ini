
[alembic]
# Location of migration scripts
script_location = %(here)s/migrations

# Add project root to Python path
prepend_sys_path = .

# Database connection
sqlalchemy.url = postgresql+psycopg2://postgres:root@localhost:5432/job_recruitment


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
